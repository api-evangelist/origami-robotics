name: Origami Robotics
description: >-
  Origami Robotics is a Y Combinator (Winter 2026) hardware startup based in
  Millbrae, California building advanced robotic hands designed specifically for
  machine learning and general-purpose robotic manipulation. The company designs
  a high-degrees-of-freedom hand with in-joint motors, co-designed with a
  matching data-collection glove that eliminates the embodiment gap between human
  and robot manipulation so that real-world training data transfers directly to
  deployed robots. Its focus areas include force transparency, avoiding the
  sim-to-real problems of high-ratio gearboxes, and scaling real-world
  manipulation data by deploying devices "in the wild." Origami Robotics targets
  industrial automation in manufacturing and logistics and has sold hands to
  Physical AI research labs including Amazon. Origami Robotics is a hardware and
  robotics company; as of this profile it publishes no public API, SDK,
  developer portal, or machine-readable interface.
